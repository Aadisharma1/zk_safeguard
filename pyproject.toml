[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zksafeguard"
version = "0.1.0"
description = "Privacy-preserving prompt-safety evaluation with CKKS encrypted scoring and a proof-of-decision prototype"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
